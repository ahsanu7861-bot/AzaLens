name: Production Release Health

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Optional deployed commit to require
        required: false
        type: string
  schedule:
    - cron: "17 */6 * * *"
  workflow_run:
    workflows:
      - Reliability Gates
    branches:
      - main
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: production-release-health
  cancel-in-progress: true

jobs:
  production-health:
    name: Verify production contracts
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event_name == 'workflow_run'
              && github.event.workflow_run.head_sha
              || github.sha }}
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Classify release deployment scope
        id: release-scope
        if: github.event_name == 'workflow_run'
        env:
          RELEASE_COMMIT: >-
            ${{ github.event.workflow_run.head_sha }}
        run: >-
          git diff-tree --no-commit-id --name-only -r
          "${{ github.event.workflow_run.head_sha }}"
          | node backend/scripts/releaseScope.js

      - name: Run release-health checks
        env:
          HEALTH_FRONTEND_URL: https://azalens.vercel.app
          HEALTH_API_URL: https://api.azalens.com
          EXPECTED_COMMIT: >-
            ${{ github.event_name == 'workflow_run'
              && steps.release-scope.outputs.expected_commit
              || inputs.expected_commit }}
          HEALTH_MAX_DEPLOYMENT_ATTEMPTS: >-
            ${{ github.event_name == 'workflow_run'
              && steps.release-scope.outputs.deployment_attempts
              || '1' }}
          HEALTH_DEPLOYMENT_POLL_INTERVAL_MS: "15000"
          HEALTH_REQUEST_TIMEOUT_MS: "45000"
          HEALTH_REPORT_PATH: backend/release-health-report.json
          OBSERVABILITY_METRICS_TOKEN: >-
            ${{ secrets.OBSERVABILITY_METRICS_TOKEN }}
        run: node backend/scripts/releaseHealthCheck.js

      - name: Upload release-health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-health-report
          path: backend/release-health-report.json
          if-no-files-found: warn
          retention-days: 14
