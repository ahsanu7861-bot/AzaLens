name: Reliability Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-contracts:
    name: Backend contracts and scenario matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install locked backend dependencies
        run: npm ci

      - name: Run deterministic reliability gates
        env:
          NODE_ENV: test
          APP_ENV: test
        run: npm run test:ci

      - name: Validate migration ordering and naming
        run: npm run check:migrations

  frontend-production:
    name: Frontend tests, lint, types, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Run deterministic frontend tests
        run: npm test

      - name: Verify WCAG AA color contrast tokens
        run: npm run test:contrast

      - name: Build frontend
        run: npm run build

      - name: Enforce frontend performance budgets
        run: npm run test:performance

  release-artifact:
    name: Versioned release artifact and provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build immutable source artifacts
        run: |
          mkdir -p release
          git archive --format=tar.gz --prefix=azalens-backend/ \
            -o release/azalens-backend-${GITHUB_SHA::7}.tar.gz \
            HEAD backend
          git archive --format=tar.gz --prefix=azalens-frontend/ \
            -o release/azalens-frontend-${GITHUB_SHA::7}.tar.gz \
            HEAD frontend
          RELEASE_VERSION="0.1.0-${GITHUB_SHA::7}" \
            node backend/scripts/createReleaseManifest.js \
            release/manifest.json release/*.tar.gz

      - name: Attest artifact provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*.tar.gz

      - name: Upload versioned release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: azalens-release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  frontend-browser:
    name: Browser journeys and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser and accessibility tests
        run: npm run test:e2e

      - name: Run visual regression tests
        run: npm run test:visual

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: warn
          retention-days: 14
