name: Reliability Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-contracts:
    name: Backend contracts and scenario matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install locked backend dependencies
        run: npm ci

      - name: Run deterministic reliability gates
        env:
          NODE_ENV: test
          APP_ENV: test
        run: npm run test:ci

      - name: Validate migration ordering and naming
        run: npm run check:migrations

      - name: Validate down-migration pairing
        run: npm run check:migrations:down

  database-policies:
    name: Database policies and tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Every step below is mandatory. There is deliberately no
    # skip-if-unavailable guard: an environment that cannot run the local
    # Supabase stack must break the build, because these two tests are the
    # only proof that one user cannot reach another user's data.

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Pinned, not `latest`. An unpinned CLI means a future Supabase release
      # can change `db reset` or migration behaviour and turn this job red with
      # no commit of ours involved. 2.111.0 is the version Slice 1 was verified
      # against locally. Bump deliberately, with a re-run, never implicitly.
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      # The action does not echo the version it resolved, so pinning alone is
      # unverifiable from the log. This asserts it.
      - name: Verify Supabase CLI version
        run: |
          EXPECTED=2.111.0
          INSTALLED="$(supabase --version | tr -d '[:space:]')"
          echo "Supabase CLI reported: ${INSTALLED}"
          if [ "${INSTALLED}" != "${EXPECTED}" ]; then
            echo "ERROR: expected Supabase CLI ${EXPECTED} but found '${INSTALLED}'."
            echo "The workflow pin and the version this slice was verified against must match."
            exit 1
          fi
          echo "Supabase CLI version pin verified: ${EXPECTED}"

      - name: Install locked backend dependencies
        working-directory: backend
        run: npm ci

      # Only Postgres, Auth, PostgREST and the gateway are needed. The
      # excluded services (studio, storage, realtime, analytics, vector,
      # imgproxy, edge runtime, pooler, mail) are not exercised by these
      # tests, and locally at 8 GB six of them failed their health checks
      # and took the whole stack down with them. Starting less is both
      # faster and more reliable.
      - name: Start local Supabase stack
        run: >-
          supabase start
          -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Replay every migration from an empty database
        run: supabase db reset

      # `supabase db reset` restarts containers. Without an explicit wait the
      # next step can hit an API that is not listening yet. Bounded, and it
      # fails loudly on timeout - it never proceeds with an unready stack.
      - name: Wait for the API to accept requests
        run: |
          for attempt in $(seq 1 60); do
            if supabase status -o env 2>/dev/null | grep -q '^API_URL='; then
              echo "API ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: Supabase API did not become ready within 300s."
          supabase status || true
          exit 1

      - name: Validate migration naming and down-migration pairing
        working-directory: backend
        run: npm run check:migrations && npm run check:migrations:down

      - name: Prove user A cannot reach user B's data
        working-directory: backend
        run: npm run test:tenant-isolation

      - name: Prove every table is covered by row level security
        working-directory: backend
        run: npm run test:rls-coverage

      - name: Prove the migrations reverse cleanly
        run: bash scripts/verifyMigrationReversibility.sh

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup

  frontend-production:
    name: Frontend tests, lint, types, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Run deterministic frontend tests
        run: npm test

      - name: Verify WCAG AA color contrast tokens
        run: npm run test:contrast

      - name: Verify Shariah design token registration
        run: npm run test:design-tokens

      - name: Verify Content Security Policy declaration
        run: npm run test:csp

      # `npm run build` also runs scripts/checkCspHashes.mjs, which fails the
      # build if the inline theme script no longer matches its pinned hash.
      - name: Build frontend
        run: npm run build

      - name: Enforce frontend performance budgets
        run: npm run test:performance

      # Runs after the build so it inspects the bundle the browser actually
      # receives, not only the source it was built from.
      - name: Verify no privileged credential reaches the frontend
        run: npm run test:privilege

  release-artifact:
    name: Versioned release artifact and provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build immutable source artifacts
        run: |
          mkdir -p release
          git archive --format=tar.gz --prefix=azalens-backend/ \
            -o release/azalens-backend-${GITHUB_SHA::7}.tar.gz \
            HEAD backend
          git archive --format=tar.gz --prefix=azalens-frontend/ \
            -o release/azalens-frontend-${GITHUB_SHA::7}.tar.gz \
            HEAD frontend
          RELEASE_VERSION="0.1.0-${GITHUB_SHA::7}" \
            node backend/scripts/createReleaseManifest.js \
            release/manifest.json release/*.tar.gz

      - name: Attest artifact provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*.tar.gz

      - name: Upload versioned release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: azalens-release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  frontend-browser:
    name: Browser journeys and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser and accessibility tests
        run: npm run test:e2e

      - name: Run visual regression tests
        env:
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run test:visual

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: warn
          retention-days: 14

      # Six reviewed Linux landing baselines are committed, and ordinary visual
      # CI above compares against them with snapshot writing disabled:
      # playwright.config.ts sets `updateSnapshots: "none"` under CI, so a
      # missing or mismatched baseline fails without ever being written.
      #
      # This step runs either way and proves that held — that the run modified
      # no committed snapshot path, left the worktree clean, and created no
      # Darwin baseline. It is as useful when the comparison passes as when it
      # fails: a green run that quietly banked a snapshot would still be a
      # failure of this contract.
      #
      # Candidate capture below is review and provenance evidence only. It never
      # accepts or updates a baseline; changing accepted baselines stays a
      # separately reviewed and authorised step.
      - name: Prove the visual run wrote no baseline
        if: always()
        working-directory: .
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- frontend/e2e)" ]; then
            echo "::error::A visual run modified a committed snapshot directory."
            git status --porcelain -- frontend/e2e
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::A visual run left the worktree dirty."
            git status --porcelain
            exit 1
          fi
          darwin="$(find frontend -name '*-darwin.png' -not -path '*/node_modules/*')"
          if [ -n "$darwin" ]; then
            echo "::error::Darwin baselines are never valid for Linux CI."
            echo "$darwin"
            exit 1
          fi
          echo "No baseline written; worktree clean; no Darwin baseline."

      # Review-only candidates. This path never calls toHaveScreenshot, so it
      # cannot write a baseline; it writes ten prefixed PNGs plus a manifest into
      # a gitignored directory.
      - name: Capture landing review candidates
        if: always()
        run: npm run visual:candidates

      - name: Upload landing review candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-visual-candidates
          path: frontend/candidate-artifacts
          if-no-files-found: error
          retention-days: 14

      - name: Upload Technical review candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-technical-visual-candidates
          path: frontend/technical-candidate-artifacts
          if-no-files-found: error
          retention-days: 14
