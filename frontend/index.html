<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explainable stock intelligence with AAOIFI Shariah screening."
    />
    <meta name="application-name" content="AzaLens" />
    <meta name="apple-mobile-web-app-title" content="AzaLens" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#050807" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AzaLens" />
    <meta property="og:title" content="AzaLens — Explainable Stock Intelligence" />
    <meta
      property="og:description"
      content="Explainable stock intelligence with AAOIFI Shariah screening."
    />
    <meta property="og:url" content="https://azalens.com/" />
    <meta property="og:image" content="https://azalens.com/azalens-social-preview.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://azalens.com/azalens-social-preview.png" />
    <link rel="canonical" href="https://azalens.com/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
    />
    <!--
      Deferred font loading, without an inline onload handler. A Content
      Security Policy blocks inline event handlers, and allowing them needs
      'unsafe-hashes', which weakens script-src for the whole site. The flip
      from media="print" to media="all" happens in src/lib/fonts.ts instead.
      Keep the data-deferred-font attribute in sync with that module.
    -->
    <link
      data-deferred-font
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
      media="print"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>AzaLens — Explainable Stock Intelligence</title>
    <script>
      (() => {
        try {
          const savedTheme = window.localStorage.getItem("azalens-theme");
          const theme =
            savedTheme === "day" || savedTheme === "night"
              ? savedTheme
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "day"
                : "night";

          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme =
            theme === "day" ? "light" : "dark";
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", theme === "day" ? "#F5F8F6" : "#050807");
        } catch {
          document.documentElement.dataset.theme = "night";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
