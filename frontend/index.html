<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explainable stock intelligence with AAOIFI Shariah screening."
    />
    <meta name="theme-color" content="#070a11" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AzaLens — Explainable Stock Intelligence</title>
    <script>
      (() => {
        try {
          const savedTheme = window.localStorage.getItem("azalens-theme");
          const theme =
            savedTheme === "day" || savedTheme === "night"
              ? savedTheme
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "day"
                : "night";

          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme =
            theme === "day" ? "light" : "dark";
        } catch {
          document.documentElement.dataset.theme = "night";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
